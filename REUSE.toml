version = 1

[[annotations]]
path = [
    "*",
    ".claude/**",
    ".codex/**",
    ".github/**",
    ".vale/**",
    "ai_pycal/**",
    "docker/**",
    "docs/**",
    "news/**",
    "tests/**",
    "static/style.css",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ai.pycal.org contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The favicon of pycal.org (https://github.com/PyCalendar/pycal.org), scaled to 64x64 pixels
[[annotations]]
path = "static/img/favicon.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 the pycal team"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The mark of GitHub from Primer Octicons (https://github.com/primer/octicons)
[[annotations]]
path = "ai_pycal/github_mark.py"
precedence = "override"
SPDX-FileCopyrightText = "GitHub Inc."
SPDX-License-Identifier = "MIT"
