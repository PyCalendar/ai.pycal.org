<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>The site is starting</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; } }
  body { margin: 0; padding: 3rem 1rem; background: var(--bg); color: var(--fg);
         font: 1rem/1.5 system-ui, sans-serif; text-align: center; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>The site is starting</h1>
<p>It is being updated and is back in a minute. This page reloads itself every 10 seconds.</p>
</main>
</body>
</html>
