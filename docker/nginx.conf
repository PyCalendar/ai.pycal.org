# nginx in front of gunicorn: it serves the static files and passes everything
# else on. Runs as any user: files in /tmp, logs to the console.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    server {
        listen LISTEN_PORT;
        listen [::]:LISTEN_PORT;
        client_max_body_size 5M;  # webhooks of large pushes

        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # while gunicorn starts (migrations after an update) or restarts: a page that says
        # so and reloads itself, instead of a bare 502
        error_page 502 504 =503 /starting.html;
        location = /starting.html {
            root /app/docker;
            internal;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
