# The setup of https://docs.ai.pycal.org/how-to/run-docker.html
#   cp .env.example .env    # then edit .env
#   docker compose up -d

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ai-pycal:
    image: ghcr.io/pycalendar/ai.pycal.org:latest
    # build: .   # to use the local code instead
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./data:/app/data   # the database, the secret key and the key of the GitHub App
    restart: unless-stopped
    logging: *logging
    # the same as the HEALTHCHECK of the image: GET /health/ (the database answers) with
    # the first host of ALLOWED_HOSTS; Sencho waits for "healthy" after each deploy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      start_period: 60s
      start_interval: 5s
      interval: 30s
      timeout: 10s
      retries: 3
