# The checks of every change. The Docker image is pushed to ghcr.io only if all of them pass:
# "latest" for every commit of main; "stable", "1.2.3" and "1.2" for a tag v1.2.3; each for
# linux/amd64 and linux/arm64. Then Sencho updates the stack of the site (docs/how-to/run-docker.rst).
# The documentation of main is published on GitHub Pages: https://docs.sign.pycal.org/
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# a newer push cancels the checks of a pull request, but never a run of main: each push to
# main must reach the image and the deployment (the deploy job runs one at a time)
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: make lint
      - run: make test
      - run: make docs
      - run: make reuse

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: make prose
      - run: make workflows

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: make docker-test
      - run: make docker-scan

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv run --group browser playwright install --with-deps --only-shell chromium
      - run: make browser-test

  push:
    name: Push the Docker image to ghcr.io
    needs: [test, checks, docker, browser, docs]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # git describe needs the tags
          fetch-depth: 0
      - name: Write the build information for the About page
        run: make version
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags of the image
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Sencho
    needs: [push]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # one deploy at a time: Sencho refuses a second update of the stack while one runs (409)
    concurrency:
      group: deploy-sencho-ai-pycal
      cancel-in-progress: false
    # the secret SENCHO_TOKEN belongs to this environment of the repository
    environment:
      # the environment keeps its first name: it holds the secret SENCHO_TOKEN
      name: ai.pycal.org
      url: https://sign.pycal.org
    steps:
      - name: Update the stack
        run: |
          if [ -z "$SENCHO_TOKEN" ]; then
            echo "::notice::No SENCHO_TOKEN in the environment ai.pycal.org: the image is pushed, nothing is deployed."
            exit 0
          fi
          curl --request POST --fail-with-body \
            --url "https://sencho.pycal.org/api/stacks/${SENCHO_STACK}/update" \
            --header "Authorization: Bearer $SENCHO_TOKEN"
        env:
          SENCHO_TOKEN: ${{ secrets.SENCHO_TOKEN }}
          SENCHO_STACK: ${{ vars.SENCHO_STACK || 'ai-pycal' }}

  docs:
    name: Build the documentation for GitHub Pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: make docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  pages:
    name: Publish the documentation on docs.sign.pycal.org
    needs: [docs, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
