{% load i18n github %}<li class="pull-item state-{% if pull.state == "closed" %}missing{% else %}{{ pull.state }}{% endif %}" data-pull="{{ pull.number }}" data-pull-state="{{ pull.state }}"><a href="/project/{{ pull.repository.full_name }}/pulls/{{ pull.number }}/">{% if show_repository %}{{ pull.repository.full_name }}{% endif %}#{{ pull.number }} {{ pull.title }}</a> {% github_link pull.url "The pull request on GitHub" %} <span class="badge pull-badge-{{ pull.state }}">{% translate pull.state_label %}</span>{% if show_author %} · <a href="{% url 'contributor' pull.author_login %}">@{{ pull.author_login }}</a>{% endif %}</li>
