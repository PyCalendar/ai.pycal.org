{% load i18n %}{% get_current_language as current %}<details class="theme-menu language-menu">
  <summary title="{% translate "Language" %}" aria-label="{% translate "Language" %}"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z" fill="none" stroke="currentColor" stroke-width="2"/></svg> <span class="language-code">{{ current|upper }}</span></summary>
  <form method="post" action="{% url 'set_language' %}">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% for code, name in languages %}<button name="language" value="{{ code }}" lang="{{ code }}" aria-pressed="{% if current == code %}true{% else %}false{% endif %}">{{ name }}</button>
    {% endfor %}
  </form>
</details>
